name: atp-monitoring
services:
  api:
    image: atp-monitoring:local
    build: .
    environment:
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
      MLFLOW_TRACKING_USERNAME: ${MLFLOW_TRACKING_USERNAME:-}
      MLFLOW_TRACKING_PASSWORD: ${MLFLOW_TRACKING_PASSWORD:-}
      MODEL_NAME: ${MODEL_NAME:-atp-match-winner}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      PORT: '8000'
    ports:
      - '127.0.0.1:${MONITORING_API_PORT:-18000}:8000'
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  prometheus:
    image: prom/prometheus:v3.13.5
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
  grafana:
    image: grafana/grafana:13.3.1
    depends_on:
      - prometheus
      - mailpit
    environment:
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_HOST: ${SMTP_HOST:-mailpit:1025}
      GF_SMTP_USER: ${SMTP_USER:-}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${SMTP_FROM:-alerts@courtside.test}
      GF_SMTP_STARTTLS_POLICY: ${SMTP_STARTTLS_POLICY:-NoStartTLS}
      ALERT_EMAIL_TO: ${SMTP_TO:-paul@courtside.test}
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_UNIFIED_ALERTING_ENABLED: 'true'
    volumes:
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./monitoring/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/courtside.yml:ro
      - ./monitoring/dashboard.json:/etc/grafana/dashboards/courtside.json:ro
      - ./monitoring/alerts.yml:/etc/grafana/provisioning/alerting/courtside.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3000:3000'
  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - '127.0.0.1:8025:8025'
volumes:
  prometheus-data:
  grafana-data:
