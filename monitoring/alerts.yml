apiVersion: 1
groups:
- orgId: 1
  name: courtside
  folder: Courtside
  interval: 10s
  rules:
  - uid: courtside-down
    title: Courtside API down
    condition: B
    for: 1m
    noDataState: Alerting
    execErrState: Error
    annotations:
      summary: Courtside API has been unreachable for one minute
    labels:
      service: courtside
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: prometheus
      model:
        expr: 1 - up{job="api"}
        instant: true
        range: false
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        refId: B
        conditions:
        - evaluator:
            params:
            - 0.5
            type: gt
          operator:
            type: and
          reducer:
            type: last
            params: []
          query:
            params:
            - B
          type: query
  - uid: courtside-errors
    title: Courtside high error rate
    condition: B
    for: 2m
    noDataState: OK
    execErrState: Error
    annotations:
      summary: More than 5 percent of predictions fail with 5xx, investigate the serving
        service
    labels:
      service: courtside
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: prometheus
      model:
        expr: (sum(rate(http_requests_total{job="api",path="/predict",status=~"5.."}[2m]))
          / clamp_min(sum(rate(http_requests_total{job="api",path="/predict"}[2m])),
          0.000001)) > bool 0.05
        instant: true
        range: false
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        refId: B
        conditions:
        - evaluator:
            params:
            - 0.5
            type: gt
          operator:
            type: and
          reducer:
            type: last
            params: []
          query:
            params:
            - B
          type: query
  - uid: courtside-drift
    title: Courtside data drift
    condition: B
    for: 2m
    noDataState: OK
    execErrState: Error
    annotations:
      summary: Input drift on {{ $labels.feature }}, investigate data and model performance,
        do not retrain automatically
    labels:
      service: courtside
    data:
    - refId: A
      relativeTimeRange:
        from: 120
        to: 0
      datasourceUid: prometheus
      model:
        expr: feature_drift{job="api"} >= bool 0.20
        instant: true
        range: false
        refId: A
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        type: threshold
        expression: A
        refId: B
        conditions:
        - evaluator:
            params:
            - 0.5
            type: gt
          operator:
            type: and
          reducer:
            type: last
            params: []
          query:
            params:
            - B
          type: query
contactPoints:
- orgId: 1
  name: courtside-email
  receivers:
  - uid: courtside-mail
    type: email
    disableResolveMessage: false
    settings:
      addresses: ${ALERT_EMAIL_TO}
      singleEmail: true
policies:
- orgId: 1
  receiver: courtside-email
  group_by:
  - grafana_folder
  - alertname
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
