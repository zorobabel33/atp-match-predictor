name: CI

on:
  pull_request:
    branches: [dev, staging, main]
    # edited: a stacked pull request retargeted to dev must run the required check.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  # Required status check on dev, staging and main. Keep the job name stable.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        # No DagsHub or Azure access here: tests use fixtures and a temporary local registry.
        run: pytest
