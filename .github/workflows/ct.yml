name: CT

on:
  workflow_dispatch:
    inputs:
      # Choose the operation explicitly so a dataset run cannot trigger rollback.
      operation:
        description: Run the pipeline or roll back production
        type: choice
        required: true
        default: pipeline
        options:
          - pipeline
          - rollback
      # A version selection simulates a new data delivery.
      dataset_version:
        description: DVC dataset version for a pipeline run
        type: choice
        required: true
        default: v1
        options:
          - v1
          - v2
      rollback_version:
        description: Previously approved MLflow model version for rollback
        type: string
        required: false

permissions:
  contents: read

# Serialize workflow operations that can update the production model.
concurrency:
  group: atp-production-model
  cancel-in-progress: false

jobs:
  train:
    # Only reviewed code on main may change the production model.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ vars.MLFLOW_TRACKING_USERNAME }}
      MODEL_NAME: ${{ vars.MODEL_NAME || 'atp-match-winner' }}
      RUN_OUTPUT_DIR: results
      DVC_NO_ANALYTICS: 'true'
    outputs:
      champion_changed: ${{ steps.decision.outputs.champion_changed }}
      champion_version: ${{ steps.decision.outputs.champion_version }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Give DVC read access to the Azure container
        if: ${{ inputs.operation == 'pipeline' }}
        env:
          AZURE_SAS_TOKEN: ${{ secrets.AZURE_SAS_TOKEN }}
        # Written to .dvc/config.local, which is never committed or uploaded.
        run: dvc remote modify --local azure sas_token "$AZURE_SAS_TOKEN"

      - name: Validate, evaluate, train and promote when eligible
        if: ${{ inputs.operation == 'pipeline' }}
        env:
          # Pass the dispatch input as an environment variable and quote it in the shell.
          DATASET_VERSION: ${{ inputs.dataset_version }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python -m ml.pipeline --dataset-version "$DATASET_VERSION"

      - name: Verify the champion can make predictions
        if: ${{ inputs.operation == 'pipeline' }}
        env:
          DATASET_VERSION: ${{ inputs.dataset_version }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python -m ml.predict --input "data/$DATASET_VERSION/evaluation.csv" --limit 3

      - name: Require a version for rollback
        if: ${{ inputs.operation == 'rollback' && inputs.rollback_version == '' }}
        run: |
          echo "Set rollback_version to a previously approved model version." >&2
          exit 1

      - name: Restore a previously approved version
        if: ${{ inputs.operation == 'rollback' }}
        env:
          TARGET_VERSION: ${{ inputs.rollback_version }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: python -m ml.pipeline --rollback "$TARGET_VERSION"

      - name: Read the decision
        id: decision
        if: ${{ always() }}
        run: python -m ml.ct_outputs results/decision.json

      - name: Upload decision and DVC evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: ct-results
          path: results/
          if-no-files-found: warn

  # Runs only when the champion alias moved (bootstrap, promotion or rollback).
  # The app resolves the alias once at startup, so a new revision is started, then the public URL
  # must serve the expected version, checked with a live prediction.
  refresh-online-model:
    needs: train
    # always(): the alias can move before a later step of train fails.
    if: ${{ always() && needs.train.outputs.champion_changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    # Same group as the deploy workflow, so two deployments never overlap.
    concurrency:
      group: atp-production-deploy
      cancel-in-progress: false
    env:
      EXPECTED_VERSION: ${{ needs.train.outputs.champion_version }}
      MODEL_NAME: ${{ vars.MODEL_NAME || 'atp-match-winner' }}
      APP_URL: ${{ vars.APP_URL }}
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      APP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}
      REFRESH_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check the settings
        run: |
          for name in EXPECTED_VERSION APP_URL RESOURCE_GROUP APP_NAME; do
            if [ -z "${!name}" ]; then
              echo "$name is empty." >&2
              exit 1
            fi
          done

      - name: Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start a new revision so the app resolves champion again
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          # Changing an environment variable creates a new revision. The previous healthy
          # revision keeps serving until the new one is ready.
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars "MODEL_NAME=$MODEL_NAME" "MODEL_REFRESH_ID=$REFRESH_ID" \
            --output none

      - name: Wait until the public URL serves the expected version
        run: |
          deadline=$((SECONDS + 600))
          while [ "$SECONDS" -lt "$deadline" ]; do
            version=$(curl -fsS --max-time 10 "$APP_URL/model-info" | jq -r '.model_version // empty' || true)
            echo "Online model version: ${version:-unavailable} (expected $EXPECTED_VERSION)"
            if [ "$version" = "$EXPECTED_VERSION" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "The public URL did not serve version $EXPECTED_VERSION in time." >&2
          echo "Container Apps keeps the previous healthy revision. Run CT with operation=rollback." >&2
          exit 1

      - name: Check readiness and make a live prediction
        run: |
          curl -fsS --max-time 10 "$APP_URL/ready" > /dev/null
          curl -fsS --max-time 10 "$APP_URL/model-info" \
            | jq -e --arg name "$MODEL_NAME" --arg version "$EXPECTED_VERSION" \
              '.model_name == $name and .model_version == $version' > /dev/null
          body='{"surface": "Hard", "tourney_level": "G", "best_of": 5,
            "player_a_rank": 1, "player_a_rank_points": 9500, "player_a_age": 23.5, "player_a_ht": 188, "player_a_hand": "R",
            "player_b_rank": 45, "player_b_rank_points": 1200, "player_b_age": 29.1, "player_b_ht": 183, "player_b_hand": "L"}'
          response=$(curl -fsS --max-time 20 -X POST "$APP_URL/predict" \
            -H 'Content-Type: application/json' -d "$body")
          echo "$response" | jq .
          echo "$response" | jq -e --arg version "$EXPECTED_VERSION" \
            '.model_version == $version
             and (.probability_player_a_wins >= 0 and .probability_player_a_wins <= 1)
             and (.predicted_winner == "player_a" or .predicted_winner == "player_b")' > /dev/null
